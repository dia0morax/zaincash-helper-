<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد وكيل زين كاش - إدارة السائقين</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. شاشة تسجيل الدخول المباشر (Google / زائر) -->
    <div id="authScreen" class="auth-screen">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fa-solid fa-wallet brand-icon"></i>
                <h2>مساعد زين كاش</h2>
                <p>سجل الدخول لاستخدام المساعد وإدارة السائقين</p>
            </div>
            
            <button id="googleLoginBtn" class="submit-btn google-btn">
                <i class="fa-brands fa-google"></i> المتابعة باستخدام حساب Google
            </button>

            <button id="guestLoginBtn" class="submit-btn btn-secondary" style="margin-top: 12px; font-weight: bold;">
                <i class="fa-solid fa-user-secret"></i> الدخول كزائر (بدون حساب)
            </button>
        </div>
    </div>

    <!-- 2. التطبيق الرئيسي (مخفي قبل تسجيل الدخول) -->
    <div id="appContainer" class="app-container hidden">
        
        <!-- الهيدر -->
        <header class="app-header">
            <div class="header-title">
                <i class="fa-solid fa-wallet brand-icon"></i>
                <h2>مساعد زين كاش</h2>
            </div>
        <div class="header-actions">
            <button id="floatWindowBtn" class="icon-btn btn-secondary" title="نافذة عائمة">
                <i class="fa-solid fa-window-restore"></i>
            </button>
            <button id="addDriverBtn" class="icon-btn btn-primary" title="إضافة سائق جديد">
                <i class="fa-solid fa-user-plus"></i>
            </button>
            <button id="settingsBtn" class="icon-btn btn-secondary" title="الإعدادات">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>
        </header>

        <!-- البحث والتصفية -->
        <main class="main-container">
            <section class="search-section">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="searchInput" placeholder="ابحث باسم السائق أو الـ ID..." autocomplete="off">
                    <!-- قائمة الاقتراحات الذكية -->
                    <div id="searchSuggestions" class="suggestions-box hidden"></div>
                </div>
                <div class="company-tags" id="companyTags">
                    <span class="tag active" data-company="all">الكل</span>
                    <span class="tag" data-company="talabat">طلبات</span>
                    <span class="tag" data-company="baleefood">بلي فود</span>
                </div>
            </section>

            <!-- زر العودة عند فتح كرت بشاشة كاملة -->
            <button id="backToListBtn" class="back-btn hidden">
                <i class="fa-solid fa-arrow-right"></i> العودة لقائمة السائقين
            </button>

            <!-- قائمة عرض السائقين -->
            <section class="drivers-list" id="driversList">
                <!-- يتم توليد البطاقات عبر JS -->
            </section>
        </main>

        <!-- نافذة إضافة / تعديل سائق -->
        <div id="driverModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modalTitle">إضافة سائق جديد</h3>
                    <span class="close-btn">&times;</span>
                </div>
                <form id="driverForm">
                    <input type="hidden" id="editDriverDocId">
                    <div class="form-group">
                        <label>اختر الشركة:</label>
                        <select id="companySelect" required>
                            <option value="talabat">طلبات</option>
                            <option value="baleefood">بلي فود</option>
                        </select>
                    </div>

                    <div id="dynamicFields">
                        <!-- حقول خاصة بطلبات فقط -->
                        <div class="form-group talabat-only">
                            <label>اسم الفرع:</label>
                            <input type="text" id="branchName" placeholder="مثال: الابداع ، الجيل السريع...">
                        </div>
                        <div class="form-group talabat-only">
                            <label>رمز العميل (رمز الشركة):</label>
                            <input type="text" id="companyCode" placeholder="رمز الشركة">
                        </div>
                        <div class="form-group talabat-only">
                            <label>ID السائق:</label>
                            <input type="text" id="driverId" placeholder="مثال: 4148032">
                        </div>

                        <!-- الحقول المشتركة (تظهر لبلي فود فقط الاسم ورقم الهاتف) -->
                        <div class="form-group">
                            <label>اسم السائق الثلاثي:</label>
                            <input type="text" id="driverName" required placeholder="الاسم الكامل">
                        </div>
                        <div class="form-group">
                            <label>رقم الهاتف:</label>
                            <input type="tel" id="driverPhone" required placeholder="0770XXXXXXX">
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">حفظ البيانات</button>
                </form>
            </div>
        </div>

        <!-- نافذة الإعدادات وتنظيف الحساب -->
        <div id="settingsModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3><i class="fa-solid fa-gear"></i> الإعدادات والحساب</h3>
                    <span class="close-settings-btn">&times;</span>
                </div>
                <div class="settings-body">
                    <p id="userEmailDisplay" class="user-email-text"></p>
                    <button onclick="location.reload()" class="submit-btn btn-sync">
                        <i class="fa-solid fa-rotate"></i> تحديث والمزامنة
                    </button>
                    <button id="logoutBtn" class="submit-btn btn-danger">
                        <i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script src="script.js"></script>
</body>
</html>
